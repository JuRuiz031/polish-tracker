name: Deploy to GitHub Pages

# Push-triggered, not scheduled — a cron workflow gets disabled by GitHub after 60 days
# of repository inactivity (the same reason the backup/heartbeat workflows were retired,
# see supabase/workflows/README.md). This only runs when there is actually a push to
# deploy, so it never goes stale on its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight at a time; a second push while one is running waits
# rather than racing it, but never cancels a deploy that's already live-updating the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
